<header class="header">
  <div class="header-container">

    <div class="header-left">
      <a routerLink="/" class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <span class="logo-text">Jutjubić</span>
      </a>
    </div>

    <!-- Desktop nav -->
    <div class="header-right desktop-nav">

      <div *ngIf="!isAuthenticated" class="auth-buttons">
        <button class="btn-outline" routerLink="/login">
          Prijavi se
        </button>
        <button class="btn-primary" routerLink="/register">
          Registruj se
        </button>
      </div>

      <div *ngIf="isAuthenticated" class="user-menu">
        <button class="btn-upload" routerLink="/upload">
          + Upload
        </button>
        <button class="btn-watch-party" routerLink="/watch-party">
          Watch Party
        </button>
        <button class="btn-outline" (click)="logout()">
          Odjavi se
        </button>
      </div>

    </div>

    <!-- Hamburger button (mobile only) -->
    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

  </div>
</header>

<!-- Backdrop overlay -->
<div class="mobile-backdrop" [class.open]="menuOpen" (click)="closeMenu()"></div>

<!-- Dropdown drawer below navbar -->
<div class="mobile-drawer" [class.open]="menuOpen">
  <nav class="drawer-nav">

    <ng-container *ngIf="!isAuthenticated">
      <a routerLink="/login" class="drawer-link" (click)="closeMenu()">
        <span class="drawer-icon icon-sm">→</span> Prijavi se
      </a>
      <a routerLink="/register" class="drawer-link" (click)="closeMenu()">
        <span class="drawer-icon icon-sm">→</span> Registruj se
      </a>
    </ng-container>

    <ng-container *ngIf="isAuthenticated">
      <a routerLink="/" class="drawer-link" (click)="closeMenu()">
        <span class="drawer-icon icon-lg">⌂</span> Početna
      </a>
      <a routerLink="/upload" class="drawer-link" (click)="closeMenu()">
        <span class="drawer-icon icon-lg">+</span> Upload
      </a>
      <a routerLink="/watch-party" class="drawer-link" (click)="closeMenu()">
        <svg class="drawer-svg-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> Watch Party
      </a>
      <div class="drawer-divider"></div>
      <a class="drawer-link logout" (click)="logout(); closeMenu()">
        <svg class="drawer-svg-icon logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Odjavi se
      </a>
    </ng-container>

  </nav>
</div>
