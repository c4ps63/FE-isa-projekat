<div class="home-container">
  <h1 class="page-title">Mapa</h1>

  <div class="map-section">
    <app-map (videosFound)="updateVideoList($event)"></app-map>
  </div>
  
  <h1 class="page-title">Najnoviji videi (u vidljivom delu mape)</h1>
  
  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Učitavanje...</p>
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error" class="videos-grid">
    <app-video-card *ngFor="let video of videos" [video]="video"></app-video-card>
  </div>

  <div *ngIf="!loading && videos.length === 0" class="no-videos">
    <p>Nema dostupnih videa u ovom delu mape.</p>
  </div>

  <div *ngIf="totalPages > 1" class="pagination">
    <button 
      class="btn-pagination" 
      [disabled]="currentPage === 0"
      (click)="previousPage()">
      ← Prethodna
    </button>
    
    <span class="page-info">
      Strana {{ currentPage + 1 }} od {{ totalPages }}
    </span>
    
    <button 
      class="btn-pagination" 
      [disabled]="currentPage === totalPages - 1"
      (click)="nextPage()">
      Sledeća →
    </button>
  </div>
</div>
