<div class="home-container">
  <h1 class="page-title">Mapa</h1>

  <div class="map-section">
    <app-map (videosFound)="updateVideoList($event)"></app-map>
  </div>

 <div *ngIf="trendingVideos.length > 0" class="trending-container">
  <div class="trending-header">
    <h2 class="trending-title">Popularno ove nedelje</h2>
  </div>
  
  <div class="trending-horizontal-list">
    <div *ngFor="let video of trendingVideos" class="trending-item">
      <app-video-card [video]="video"></app-video-card>
    </div>
  </div>
</div>

  <div class="section-header">
    <h1 class="page-title">Najnoviji videi</h1>
    
    <div class="filter-container">
      <select 
        id="timeFilter" 
        class="filter-select" 
        (change)="onFilterChange($event)">
        <option value="ALL">Svo vreme</option>
        <option value="LAST_30_DAYS">Poslednjih 30 dana</option>
        <option value="THIS_YEAR">Tekuća godina</option>
      </select>
    </div>
  </div>
  
  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Učitavanje...</p>
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error" class="videos-grid">
    <app-video-card *ngFor="let video of videos" [video]="video"></app-video-card>
  </div>

  <div *ngIf="!loading && videos.length === 0" class="no-videos">
    <p>Nema dostupnih videa u ovom delu mape.</p>
  </div>

  <div *ngIf="totalPages > 1" class="pagination">
    <button 
      class="btn-pagination" 
      [disabled]="currentPage === 0"
      (click)="previousPage()">
      ← Prethodna
    </button>
    
    <span class="page-info">
      Strana {{ currentPage + 1 }} od {{ totalPages }}
    </span>
    
    <button 
      class="btn-pagination" 
      [disabled]="currentPage === totalPages - 1"
      (click)="nextPage()">
      Sledeća →
    </button>
  </div>
</div>
