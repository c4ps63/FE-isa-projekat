<div class="upload-container">
  <h2 class="page-title">Nova Objava</h2>

  <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()" class="upload-form">
    
    <div class="form-group">
      <label for="title">Naslov videa *</label>
      <input 
        id="title" 
        type="text" 
        formControlName="title" 
        placeholder="Unesite naslov..."
        class="form-input"
      >
    </div>

    <div class="form-group">
      <label for="description">Opis</label>
      <textarea 
        id="description" 
        formControlName="description" 
        rows="4" 
        placeholder="O čemu se radi u videu?"
        class="form-input"
      ></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="tags">Tagovi (odvojeni zarezom)</label>
        <input 
          id="tags" 
          type="text" 
          formControlName="tags" 
          placeholder="npr. muzika, sport, vesti"
          class="form-input"
        >
      </div>

      <div class="form-group">
        <label for="location">Lokacija (Ulica, Broj, Grad)</label>
        <input 
          id="location" 
          type="text" 
          formControlName="location" 
          placeholder="npr. Bulevar Oslobođenja 12, Novi Sad"
          class="form-input"
        >
        <small style="color: #888; font-size: 0.8em;">Unesite punu adresu za prikaz na mapi.</small>
      </div>
    </div>

    <div class="form-group schedule-box" style="margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background-color: #f9f9f9;">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <input type="checkbox" id="isScheduled" formControlName="isScheduled" style="width: 20px; height: 20px; cursor: pointer;">
        <label for="isScheduled" style="font-weight: bold; cursor: pointer; margin: 0;">Zakaži premijeru (Live Stream)</label>
      </div>
      
      <div *ngIf="uploadForm.get('isScheduled')?.value" class="schedule-input">
        <label for="scheduledTime">Datum i vreme početka:</label>
        <input 
          id="scheduledTime" 
          type="datetime-local" 
          formControlName="scheduledTime"
          class="form-input"
        >
        <small style="color: #666; display: block; margin-top: 5px;">Video neće biti dostupan za gledanje pre ovog vremena.</small>
      </div>
    </div>

    <div class="file-uploads">
      <div class="form-group file-box">
        <label>Video Fajl (MP4, max 200MB) *</label>
        <input 
          type="file" 
          accept="video/mp4" 
          (change)="onVideoSelected($event)"
          class="file-input"
        >
        <div class="file-status" *ngIf="selectedVideoFile">
           ✅ Izabran: {{ selectedVideoFile.name }}
        </div>
      </div>

      <div class="form-group file-box">
        <label>Thumbnail (Slika) *</label>
        <input 
          type="file" 
          accept="image/*" 
          (change)="onThumbnailSelected($event)"
          class="file-input"
        >
        <div class="file-status" *ngIf="selectedThumbnailFile">
            ✅ Izabran: {{ selectedThumbnailFile.name }}
         </div>
      </div>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="form-actions">
      <button 
        type="submit" 
        class="btn-submit" 
        [disabled]="uploadForm.invalid || !selectedVideoFile || !selectedThumbnailFile || isLoading"
      >
        <span *ngIf="!isLoading">Postavi Objavu</span>
        <span *ngIf="isLoading" class="spinner-small"></span>
        <span *ngIf="isLoading"> Upload...</span>
      </button>
    </div>

  </form>
</div>
